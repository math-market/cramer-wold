name: verify
on:
  push: {branches: [main]}
  pull_request:
jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # the statement check needs the criteria commit
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # The same script a solver runs locally — not an equivalent one, the same
      # one. "Green on my machine" and "green in CI" cannot diverge if there is
      # only one implementation of what green means.
      - name: Verify
        run: ./verify.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: axiom-report, path: axiom-report.txt}
